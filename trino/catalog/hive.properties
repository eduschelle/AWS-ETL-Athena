# Catálogo "hive" no Trino (~ Data Source "AwsDataCatalog" no Athena)
# Este arquivo dá nome ao catálogo: hive.properties -> catálogo "hive"
connector.name=hive

# Onde está o Hive Metastore (o catálogo de tabelas em si)
hive.metastore.uri=thrift://hive-metastore:9083

# Como o Trino fala com o Data Lake (MinIO simulando S3).
# Nomenclatura "fs.s3.*" / "s3.*" (filesystem S3 nativo) — versões mais antigas do
# Trino usavam prefixo "hive.s3.*", que foi descontinuado.
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin123

# Casa colunas do Parquet por NOME, nao por posicao (o default do conector Hive e
# por posicao). Sem isto, inserir uma coluna no meio do schema de uma tabela larga
# embaralha silenciosamente todas as colunas seguintes, sem erro algum.
hive.parquet.use-column-names=true

# Permite consultar tabelas externas (não gerenciadas pelo Hive)
hive.non-managed-table-writes-enabled=true
